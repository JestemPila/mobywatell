<head>
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/more.css">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/eagle_logo.svg">
    <link rel="apple-touch-icon" href="assets/images/eagle_logo.svg">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more more_open"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top_bar">
            <div class="logo_holder">
                <img class="app_logo" src="assets/images/eagle_logo.svg">
            </div>
            <p class="logout_link">Wyloguj się</p>
        </div>
        <p class="main_title">Więcej</p>

        <p class="section_title">Twoje dane</p>
        <div class="services_list">
            <div class="service">
                <div class="icon_wrap" style="background:#007aff;"><img class="service_icon" src="assets/images/legal.svg"></div>
                <p class="service_name">Dane zameldowania</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service" style="border: none;">
                <div class="icon_wrap" style="background:#5856d6;"><img class="service_icon" src="assets/images/certificate.svg"></div>
                <p class="service_name">Dane paszportu</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
        </div>

        <p class="section_title">Ustawienia</p>
        <div class="services_list">
            <div class="service">
                <div class="icon_wrap" style="background:#ff9500;"><img class="service_icon" src="assets/images/change_password.svg"></div>
                <p class="service_name">Zmień hasło</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service">
                <div class="icon_wrap" style="background:#007aff;"><img class="service_icon" src="assets/images/fingerprint.svg"></div>
                <p class="service_name">Logowanie biometryczne</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service">
                <div class="icon_wrap" style="background:#ff3b30;"><img class="service_icon" src="assets/images/notifications.svg"></div>
                <p class="service_name">Powiadomienia</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service">
                <div class="icon_wrap" style="background:#5856d6;"><img class="service_icon" src="assets/images/help.svg"></div>
                <p class="service_name">Wygląd</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service">
                <div class="icon_wrap" style="background:#34c759;"><img class="service_icon" src="assets/images/help.svg"></div>
                <p class="service_name">Język aplikacji</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service" style="border: none;">
                <div class="icon_wrap" style="background:#007aff;"><img class="service_icon" src="assets/images/certificate.svg"></div>
                <p class="service_name">Wydane certyfikaty</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
        </div>

        <p class="section_title">Pozostałe</p>
        <div class="services_list" style="margin-bottom: 100px;">
            <div class="service">
                <div class="icon_wrap" style="background:#ff9500;"><img class="service_icon" src="assets/images/history.svg"></div>
                <p class="service_name">Historia aktywności</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
            <div class="service" style="border: none;">
                <div class="icon_wrap" style="background:#5856d6;"><img class="service_icon" src="assets/images/help.svg"></div>
                <p class="service_name">O aplikacji</p>
                <img class="arrow" src="assets/images/chevron_right.svg">
            </div>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
</body>
